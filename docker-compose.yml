services:
  cats-dogs-api:
    build: .
    image: ${IMAGE_URI:-ghcr.io/rajkumar-madhavan/mlops-cats-dogs:latest}
    container_name: cats-dogs-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/cnn_latest.pt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
