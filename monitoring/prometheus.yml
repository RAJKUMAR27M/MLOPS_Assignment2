global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'cats-dogs-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000'] # Assuming API is on host machine
        # Note: In a real docker network, this would point to the API service name e.g., 'cats-dogs-api:8000'
